<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Film Finder</title>
     <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header> 
            <h1>Film Finder</h1>

    </header>
    <main>
        <section class="search">
        <form id="search-form">
            <input id="search-input" type="text" placeholder="Search for a film"> 
            <button type="submit">Search</button>
        </form>
        <select id="sort-select"> <option value="default">Sort:Default</option>
            <option value="title">Title A to Z</option>
            <option value="year">Year, newest first</option>

        </select>
    </section>
    <p id="loading"hidden>Loading...</p>
    <section id="results" class="results"></section>
    </main>
    <footer>
  <p>Film Finder. Movie data from the OMDb API.</p>
</footer>
    <script src="index.js"></script>
</body>
</html>
